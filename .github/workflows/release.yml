name: Release

# Creates a GitHub Release when you push a version tag (e.g. v0.1.0).
# Tag must match package.json "version". Run full CI before attaching notes.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: GitHub Release
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js toolchain
        uses: ./.github/actions/setup-node

      - name: Verify tag matches package.json version
        if: github.event_name == 'push'
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Quality gate
        run: npm run ci

      - name: Extract release notes from CHANGELOG
        if: github.event_name == 'push'
        run: node scripts/extract-changelog-section.mjs "${GITHUB_REF#refs/tags/v}"

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          name: Brainwire ${{ github.ref_name }}
          body_path: release-notes.md
          generate_release_notes: false
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
