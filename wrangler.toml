name = "brainwire"
main = "worker/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# ───────────────────────────────────────────────────────────────
# Static assets — the built React/Vite bundle in ./dist
# ───────────────────────────────────────────────────────────────
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# ───────────────────────────────────────────────────────────────
# Cloudflare bindings — free tier is enough for personal use
# ───────────────────────────────────────────────────────────────

# KV — dynamic API keys + webhook payloads + background jobs (TTL'd)
[[kv_namespaces]]
binding = "CACHE"
id = "61d56978d1244e59bfe5e6dde6ed7440"            # bootstrap via scripts/bootstrap_cf_resources.py
preview_id = "61d56978d1244e59bfe5e6dde6ed7440"  # same namespace for preview

# R2 — uploaded files + generated media (optional — enable R2 in dashboard first,
# then uncomment and run `wrangler r2 bucket create brainwire-storage`)
# [[r2_buckets]]
# binding = "STORAGE"
# bucket_name = "brainwire-storage"

# D1 — projects, workflows, kv, webhook_log
[[d1_databases]]
binding = "DB"
database_name = "brainwire"
database_id = "278f9e36-61c7-47ab-9eab-b49471fae9f3"  # bootstrap via scripts/bootstrap_cf_resources.py

# Workers AI — text/image/embedding generation + workflow generator fallback
[ai]
binding = "AI"

# ───────────────────────────────────────────────────────────────
# Static secrets (optional — set via dashboard or wrangler secret put)
# ───────────────────────────────────────────────────────────────
# Run `wrangler secret put <NAME>` for each one:
#   KAGGLE_USERNAME, KAGGLE_KEY, KAGGLE_NOTEBOOK_SLUG
#   GROQ_API_KEY, OPENROUTER_API_KEY, GEMINI_API_KEY
#   YOUTUBE_API_KEY, YOINKU_API_KEY
#   NOTION_API_KEY, GITHUB_TOKEN, SLACK_TOKEN, RESEND_API_KEY
#   TELEGRAM_BOT_TOKEN
#
# Or skip these entirely — the worker also accepts keys via POST /api/keys
# (stored in KV, takes effect immediately without redeploying).

# ───────────────────────────────────────────────────────────────
# Cron triggers (optional — keep disabled by default)
# ───────────────────────────────────────────────────────────────
# [triggers]
# crons = ["0 3 * * *"]  # Daily cleanup at 03:00 UTC

# ───────────────────────────────────────────────────────────────
# Observability
# ───────────────────────────────────────────────────────────────
[observability]
enabled = true
head_sampling_rate = 1

# ───────────────────────────────────────────────────────────────
# Vars (non-secret, plain text)
# ───────────────────────────────────────────────────────────────
[vars]
WORKER_VERSION = "3.0.0"
